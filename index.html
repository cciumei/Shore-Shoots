<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Congratulations!</title>
  <style>
    :root {
      --bg: #0b0b10;
      --card: #141420;
      --text: #f2f2f7;
      --muted: #b8b8c7;
      --btn: #2f6bff;
      --btn2: #1f2240;
      --shadow: 0 20px 60px rgba(0,0,0,.55);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% 10%, #1b1b35 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .top {
      padding: 28px 24px 14px;
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: clamp(22px, 3.2vw, 34px); }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 18px 24px 26px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, opacity .15s ease;
    }
    button:active { transform: translateY(1px) scale(0.99); }
    .primary { background: var(--btn); color: white; }
    .ghost { background: var(--btn2); color: var(--text); border: 1px solid rgba(255,255,255,.12); }
    .hidden { display: none !important; }

    .reveal {
      border-top: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.20);
      padding: 18px 18px 22px;
    }
    .imgwrap {
      width: 100%;
      display: grid;
      place-items: center;
      gap: 12px;
    }
    img {
      width: min(620px, 100%);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 12px 38px rgba(0,0,0,.45);
    }
    .caption {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 0 8px;
    }
  </style>
</head>

<body>
  <main class="card" role="main" aria-live="polite">
    <section class="top">
      <h1 id="headline">Congratulations 🎉</h1>
      <p id="subtext">
        You’ve unlocked a totally legit reward. Click below to claim it.
      </p>
    </section>

    <section class="actions">
      <button class="primary" id="claimBtn">Claim</button>
      <button class="ghost" id="resetBtn">Reset</button>
    </section>

    <section class="reveal hidden" id="reveal">
      <div class="imgwrap">
        <h1 style="margin: 0; font-size: clamp(20px, 3vw, 30px); text-align:center;">
          should have went to college Lawrence
        </h1>
        <img src="lawrence.png" alt="Meme image" />
        <div class="caption">Prank site. No real prize—just vibes.</div>
      </div>
    </section>
  </main>

  <script>
    const claimBtn = document.getElementById("claimBtn");
    const resetBtn = document.getElementById("resetBtn");
    const reveal = document.getElementById("reveal");
    const headline = document.getElementById("headline");
    const subtext = document.getElementById("subtext");

    claimBtn.addEventListener("click", () => {
      headline.textContent = "Claim submitted ✅";
      subtext.textContent = "Processing your reward... (lol)";
      reveal.classList.remove("hidden");
      claimBtn.disabled = true;
      claimBtn.style.opacity = 0.7;
    });

    resetBtn.addEventListener("click", () => {
      headline.textContent = "Congratulations 🎉";
      subtext.textContent = "You’ve unlocked a totally legit reward. Click below to claim it.";
      reveal.classList.add("hidden");
      claimBtn.disabled = false;
      claimBtn.style.opacity = 1;
    });
  </script>
</body>
</html>
